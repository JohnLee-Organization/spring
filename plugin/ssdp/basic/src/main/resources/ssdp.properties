# 广播的 IP 地址。 在IPv4环境，当需要使用多播方式传送相关消息的时候，SSDP一般使用多播地址239.255.255.250和UDP端口号1900。
ssdp.broadcast.address.ipv4=239.255.255.250

# 根据互联网地址指派机构的指派，SSDP在IPv6环境下使用多播地址FF0x::C，这里的X根据scope的不同可以有不同的取值。
ssdp.broadcast.address.ipv6=FF01::C

# 广播的端口号
ssdp.broadcast.port=1900

# 本地的 IP 地址
ssdp.local.address.ipv4=0.0.0.0
ssdp.local.address.ipv6=::

# 本地的端口号
ssdp.local.port=1900

# SSDP 通知有效时长(单位：秒)。
ssdp.time.age.max=5

# 产品名称
ssdp.product.name=SSDP

# 产品版本号
ssdp.product.version=1.0.0

# 设置设备响应最长等待时间(单位：秒)，设备响应在0和这个值之间随机选择响应延迟的值。这样可以为控制点响应平衡网络负载。
ssdp.time.delay.max=5

# 设置要获取 IP 地址的网卡名
ssdp.network.interface.name=eth0
