# 广播的 IP 地址
ssdp.broadcast.address=239.255.255.250

# 广播的端口号
ssdp.broadcast.port=1900

# SSDP 通知有效时长(单位：秒)。
ssdp.time.age.max=5

# 产品名称
ssdp.product.name=SSDP

# 产品版本号
ssdp.product.version=1.0.0

# 设置设备响应最长等待时间(单位：秒)，设备响应在0和这个值之间随机选择响应延迟的值。这样可以为控制点响应平衡网络负载。
ssdp.time.delay.max=5

# 设置要获取 IP 地址的网卡名
ssdp.network.interface.name=eth0
